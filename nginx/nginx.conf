# Configuración del servidor HTTP
server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;
    return 301 https://$host$request_uri;
}

server {
    # Configuración del servidor HTTPS
    listen 443 ssl;
    server_name localhost;

    # Configuración del certificado SSL
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    
    # Configuraciones de seguridad adicionales
    server_tokens off;  # Oculta la versión de nginx
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Configuración para indicar el tamaño máximo de la solicitud
    client_max_body_size 100M;
    
    # Configuración para servir el frontend (SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Configuración para el backend (API)
    location /api {
        proxy_pass http://red-egresados-uvm-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Configuración para WebSockets (socket.io)
    location /socket.io {
        proxy_pass http://red-egresados-uvm-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}